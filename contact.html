<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Dravelq</title>
    <link rel="stylesheet" href="contact.css">
    
</head>
<body>
    <main>
        <h1>Contact Us</h1>
        <p>If you have any questions or inquiries, send us a message using the form below or email us at
            <a href="mailto:doludave67@gmail.com">doludave67@gmail.com</a>.
        </p>

        <form action="mailto:doludave67@gmail.com" method="post" enctype="text/plain">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div>
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <button type="submit">Send message</button>
            <p class="submit-status" id="submit-status" role="status" aria-live="polite" hidden></p>
        </form>
        <nav class="back-links" aria-label="Return to a website">
            <a class="back-link" href="index.html">Back to Opta X</a>
            <a class="back-link" href="dravelq.html">Back to Dravelq</a>
        </nav>
    </main>
    <script>
        const form = document.querySelector("form");
        const message = document.querySelector("#message");
        const status = document.querySelector("#submit-status");

        form.addEventListener("submit", (event) => {
            const wordCount = message.value.trim().split(/\s+/).filter(Boolean).length;
            if (wordCount < 10) {
                message.setCustomValidity("Please enter a message with at least 10 words.");
                event.preventDefault();
                message.reportValidity();
                return;
            }

            event.preventDefault();
            const name = document.querySelector("#name").value.trim();
            const email = document.querySelector("#email").value.trim();
            const subject = document.querySelector("#subject").value.trim();
            const body = `Name: ${name}\nEmail: ${email}\n\n${message.value.trim()}`;

            status.textContent = "Opening your email app with your message ready to send.";
            status.hidden = false;
            window.location.href = `mailto:doludave67@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });

        message.addEventListener("input", () => {
            message.setCustomValidity("");
        });
    </script>
</body>
</html>
